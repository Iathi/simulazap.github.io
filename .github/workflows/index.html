<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Orçamento Rápido</title>
    <style>
        /* Estilos Gerais para Mobile e Desktop */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2c3e50;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            margin: 20px;
            padding: 35px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            border-top: 6px solid #25d366;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #128c7e;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .info-card {
            background-color: #f9fbf9;
            border-left: 4px solid #128c7e;
            padding: 15px;
            text-align: left;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* O Botão do WhatsApp */
        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #25d366;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 16px 20px;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-whatsapp:active {
            transform: scale(0.98);
            background-color: #1ebd59;
        }

        .btn-whatsapp svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            margin-right: 10px;
        }

        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Nome/Marca do seu negócio -->
        <div class="logo">Orçamento Rápido</div>
        <div class="subtitle">Receba sua cotação em poucos minutos</div>

        <!-- Bloco explicativo de conversão -->
        <div class="info-card">
            <strong>Como funciona?</strong><br>
            Clique no botão abaixo para iniciar uma conversa direto no nosso WhatsApp. Você nos passa os detalhes do que precisa e enviamos o valor na hora!
        </div>

        <!-- Importante: Ajuste o link abaixo com o seu número de telefone real -->
        <!-- Formato: https://wa.me/55 + DDD + SEU_NUMERO?text=SUA_MENSAGEM -->
        <a href="https://wa.me/5511999999999?text=Olá! Gostaria de fazer um orçamento." class="btn-whatsapp" target="_blank">
            <!-- Ícone nativo em SVG do WhatsApp -->
            <svg viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.513 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.724-1.455L0 24zm6.59-4.846c1.665.988 3.3.15 4.975.15 5.564 0 10.093-4.529 10.097-10.093.002-2.695-1.047-5.228-2.951-7.133C16.859 2.173 14.329.124 11.63.124c-5.564 0-10.093 4.529-10.097 10.093-.001 1.914.499 3.784 1.446 5.43L1.81 21.113l5.513-1.446z"/>
            </svg>
            Chamar no WhatsApp
        </a>

        <div class="footer">
            Atendimento imediato e sem compromisso.
        </div>
    </div>

</body>
</html>
